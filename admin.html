<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAKAN - إدارة المنتجات</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --cream: #FDFBF7;
            --olive: #2C3E2E;
            --terracotta: #C85A32;
            --terracotta-dark: #A03820;
            --gold: #D4A359;
            --dark: #1A1A1A;
            --white: #FFFFFF;
            --border: #E8E2D8;
            --text-muted: #7A8A7C;
            --success: #27ae60;
            --danger: #e74c3c;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Tajawal', sans-serif; background: var(--cream); color: var(--olive); min-height: 100vh; }
        .header { background: var(--olive); color: var(--cream); padding: 1.5rem 2rem; display: flex; justify-content: space-between; align-items: center; }
        .header h1 { font-size: 1.8rem; font-weight: 900; letter-spacing: 4px; }
        .header a { color: var(--gold); text-decoration: none; font-weight: 600; }
        .container { max-width: 1200px; margin: 2rem auto; padding: 0 1rem; }
        .card { background: var(--white); border-radius: 16px; padding: 2rem; margin-bottom: 2rem; box-shadow: 0 4px 20px rgba(0,0,0,0.06); border: 1px solid var(--border); }
        .card h2 { font-size: 1.5rem; font-weight: 800; color: var(--terracotta); margin-bottom: 1.5rem; border-bottom: 3px solid var(--gold); padding-bottom: 0.5rem; display: inline-block; }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.2rem; }
        .form-group { display: flex; flex-direction: column; gap: 0.4rem; }
        .form-group.full { grid-column: 1 / -1; }
        label { font-weight: 600; font-size: 0.95rem; color: var(--olive); }
        input, textarea, select { padding: 0.8rem 1rem; border: 2px solid var(--border); border-radius: 10px; font-family: 'Tajawal', sans-serif; font-size: 1rem; transition: all 0.3s; background: var(--cream); }
        input:focus, textarea:focus { border-color: var(--terracotta); outline: none; box-shadow: 0 0 0 3px rgba(200,90,50,0.1); }
        textarea { resize: vertical; min-height: 80px; }
        .btn { padding: 0.9rem 2rem; border: none; border-radius: 10px; font-family: 'Tajawal', sans-serif; font-size: 1.1rem; font-weight: 700; cursor: pointer; transition: all 0.3s; }
        .btn-primary { background: var(--terracotta); color: white; }
        .btn-primary:hover { background: var(--terracotta-dark); transform: translateY(-2px); }
        .btn-success { background: var(--success); color: white; }
        .btn-success:hover { background: #219a52; }
        .btn-danger { background: var(--danger); color: white; }
        .btn-danger:hover { background: #c0392b; }
        .btn-gold { background: var(--gold); color: var(--dark); }
        .btn-gold:hover { background: #c4953d; }
        .btn-sm { padding: 0.5rem 1.2rem; font-size: 0.9rem; }
        .products-list { display: grid; gap: 1rem; }
        .product-item { display: flex; align-items: center; gap: 1rem; padding: 1rem; background: var(--cream); border-radius: 12px; border: 1px solid var(--border); transition: all 0.3s; }
        .product-item:hover { border-color: var(--terracotta); box-shadow: 0 4px 15px rgba(200,90,50,0.1); }
        .product-thumb { width: 80px; height: 80px; border-radius: 10px; object-fit: cover; flex-shrink: 0; }
        .product-details { flex: 1; }
        .product-details h4 { font-size: 1.1rem; color: var(--olive); margin-bottom: 0.3rem; }
        .product-details p { font-size: 0.9rem; color: var(--text-muted); }
        .product-actions { display: flex; gap: 0.5rem; }
        .image-preview { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-top: 0.5rem; }
        .image-preview img { width: 80px; height: 80px; object-fit: cover; border-radius: 8px; border: 2px solid var(--border); }
        .upload-area { border: 3px dashed var(--border); border-radius: 12px; padding: 2rem; text-align: center; cursor: pointer; transition: all 0.3s; background: var(--cream); }
        .upload-area:hover { border-color: var(--terracotta); background: rgba(200,90,50,0.03); }
        .upload-area.dragover { border-color: var(--gold); background: rgba(212,163,89,0.1); }
        .upload-area p { color: var(--text-muted); margin-top: 0.5rem; }
        .badge-input { display: flex; gap: 0.5rem; align-items: center; }
        .badge-options { display: flex; gap: 0.5rem; flex-wrap: wrap; }
        .badge-option { padding: 0.4rem 1rem; border: 2px solid var(--border); border-radius: 20px; cursor: pointer; font-size: 0.85rem; transition: all 0.3s; }
        .badge-option.active { border-color: var(--gold); background: var(--gold); color: var(--dark); font-weight: 700; }
        .toast { position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%); padding: 1rem 2rem; border-radius: 10px; color: white; font-weight: 600; z-index: 9999; animation: slideUp 0.3s ease; }
        .toast-success { background: var(--success); }
        .toast-error { background: var(--danger); }
        @keyframes slideUp { from { transform: translateX(-50%) translateY(20px); opacity: 0; } to { transform: translateX(-50%) translateY(0); opacity: 1; } }
        .loading { text-align: center; padding: 3rem; color: var(--text-muted); }
        .spinner { display: inline-block; width: 40px; height: 40px; border: 4px solid var(--border); border-top-color: var(--terracotta); border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 1rem; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .tabs { display: flex; gap: 0.5rem; margin-bottom: 1.5rem; border-bottom: 2px solid var(--border); padding-bottom: 0.5rem; }
        .tab { padding: 0.7rem 1.5rem; border-radius: 10px 10px 0 0; cursor: pointer; font-weight: 600; transition: all 0.3s; border: none; background: none; font-family: 'Tajawal', sans-serif; font-size: 1rem; }
        .tab.active { background: var(--terracotta); color: white; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .url-input-group { display: flex; gap: 0.5rem; }
        .url-input-group input { flex: 1; }
        @media (max-width: 768px) {
            .form-grid { grid-template-columns: 1fr; }
            .product-item { flex-direction: column; text-align: center; }
            .product-actions { justify-content: center; }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>MAKAN - إدارة المنتجات</h1>
        <a href="index.html">العودة للموقع</a>
    </div>

    <div class="container">
        <div class="card">
            <h2>إضافة منتج جديد</h2>
            <form id="productForm">
                <div class="form-grid">
                    <div class="form-group">
                        <label>اسم المنتج *</label>
                        <input type="text" id="productName" required placeholder="مثال: قوار زرع طويل">
                    </div>
                    <div class="form-group">
                        <label>السعر (دينار) *</label>
                        <input type="number" id="productPrice" required min="0" placeholder="18">
                    </div>
                    <div class="form-group full">
                        <label>المقاس *</label>
                        <input type="text" id="productSize" required placeholder="مثال: 📏 ارتفاع 64 سم | عرض 40 سم">
                    </div>
                    <div class="form-group full">
                        <label>الشارة (اختياري)</label>
                        <div class="badge-options">
                            <span class="badge-option" data-value="" onclick="selectBadge(this)">بدون</span>
                            <span class="badge-option" data-value="جديد" onclick="selectBadge(this)">جديد</span>
                            <span class="badge-option" data-value="الأكثر مبيعاً" onclick="selectBadge(this)">الأكثر مبيعاً</span>
                            <span class="badge-option" data-value="عرض خاص" onclick="selectBadge(this)">عرض خاص</span>
                        </div>
                        <input type="hidden" id="productBadge" value="">
                    </div>
                </div>

                <div class="form-group full" style="margin-top: 1.5rem;">
                    <label>صور المنتج *</label>
                    <div class="tabs">
                        <button type="button" class="tab active" onclick="switchTab('upload')">رفع من الجهاز</button>
                        <button type="button" class="tab" onclick="switchTab('url')">رابط الصورة</button>
                    </div>
                    <div class="tab-content active" id="tab-upload">
                        <div class="upload-area" id="uploadArea">
                            <div style="font-size: 3rem;">📁</div>
                            <p>اسحب الصور هنا أو اضغط لاختيار صور</p>
                            <p style="font-size: 0.8rem; color: var(--text-muted);">يمكنك اختيار عدة صور</p>
                            <input type="file" id="fileInput" multiple accept="image/*" style="display: none;">
                        </div>
                    </div>
                    <div class="tab-content" id="tab-url">
                        <div class="url-input-group">
                            <input type="url" id="imageUrl" placeholder="https://example.com/image.jpg">
                            <button type="button" class="btn btn-gold btn-sm" onclick="addImageFromUrl()">إضافة</button>
                        </div>
                        <p style="font-size: 0.85rem; color: var(--text-muted); margin-top: 0.5rem;">أدخل رابط الصورة واضغط إضافة</p>
                    </div>
                    <div class="image-preview" id="imagePreview"></div>
                </div>

                <div style="margin-top: 1.5rem; display: flex; gap: 1rem;">
                    <button type="submit" class="btn btn-primary" id="submitBtn">إضافة المنتج</button>
                    <button type="button" class="btn btn-gold" onclick="resetForm()" id="cancelBtn" style="display: none;">إلغاء</button>
                </div>
            </form>
        </div>

        <div class="card">
            <h2>المنتجات الحالية</h2>
            <div id="productsList" class="loading">
                <div class="spinner"></div>
                <p>جاري تحميل المنتجات...</p>
            </div>
        </div>
    </div>

    <script>
        var products = [];
        var imageFiles = [];
        var editingId = null;
        var githubToken = localStorage.getItem('github_token') || '';
        var repoOwner = 'ghabood267-design';
        var repoName = 'makan-pottery';

        function init() {
            if (!githubToken) {
                githubToken = prompt('أدخل GitHub Personal Access Token:\n(يجب أن يكون لديك صلاحية repo)\n\nمن GitHub > Settings > Developer settings > Personal access tokens');
                if (githubToken) {
                    localStorage.setItem('github_token', githubToken);
                }
            }
            loadProducts();
            setupUpload();
        }

        function loadProducts() {
            fetch('products.json')
                .then(function(r) { return r.json(); })
                .then(function(data) {
                    products = data;
                    renderProducts();
                })
                .catch(function() {
                    document.getElementById('productsList').innerHTML = '<p style="color:var(--danger);text-align:center;">خطأ في تحميل المنتجات</p>';
                });
        }

        function renderProducts() {
            var list = document.getElementById('productsList');
            if (products.length === 0) {
                list.innerHTML = '<p style="text-align:center;color:var(--text-muted);">لا يوجد منتجات بعد</p>';
                return;
            }
            var html = '';
            products.forEach(function(p) {
                var thumb = p.images && p.images.length > 0 ? p.images[0] : '';
                html += '<div class="product-item">' +
                    (thumb ? '<img src="' + thumb + '" class="product-thumb" alt="' + p.name + '">' : '') +
                    '<div class="product-details">' +
                    '<h4>' + p.name + (p.badge ? ' <span style="color:var(--gold);font-size:0.8rem;">(' + p.badge + ')</span>' : '') + '</h4>' +
                    '<p>' + p.size + ' | ' + p.price + ' دينار | ' + p.images.length + ' صور</p>' +
                    '</div>' +
                    '<div class="product-actions">' +
                    '<button class="btn btn-gold btn-sm" onclick="editProduct(' + p.id + ')">تعديل</button>' +
                    '<button class="btn btn-danger btn-sm" onclick="deleteProduct(' + p.id + ')">حذف</button>' +
                    '</div></div>';
            });
            list.innerHTML = html;
        }

        function setupUpload() {
            var area = document.getElementById('uploadArea');
            var input = document.getElementById('fileInput');
            area.addEventListener('click', function() { input.click(); });
            area.addEventListener('dragover', function(e) { e.preventDefault(); area.classList.add('dragover'); });
            area.addEventListener('dragleave', function() { area.classList.remove('dragover'); });
            area.addEventListener('drop', function(e) {
                e.preventDefault();
                area.classList.remove('dragover');
                handleFiles(e.dataTransfer.files);
            });
            input.addEventListener('change', function() { handleFiles(this.files); });
        }

        function handleFiles(files) {
            Array.from(files).forEach(function(file) {
                if (!file.type.startsWith('image/')) return;
                var reader = new FileReader();
                reader.onload = function(e) {
                    imageFiles.push({ data: e.target.result, name: file.name });
                    updatePreview();
                };
                reader.readAsDataURL(file);
            });
        }

        function addImageFromUrl() {
            var url = document.getElementById('imageUrl').value.trim();
            if (!url) return;
            imageFiles.push({ data: url, name: url.split('/').pop(), isUrl: true });
            document.getElementById('imageUrl').value = '';
            updatePreview();
        }

        function updatePreview() {
            var preview = document.getElementById('imagePreview');
            preview.innerHTML = '';
            imageFiles.forEach(function(img, i) {
                var container = document.createElement('div');
                container.style.position = 'relative';
                container.style.display = 'inline-block';
                var imgEl = document.createElement('img');
                imgEl.src = img.data;
                imgEl.alt = img.name;
                var removeBtn = document.createElement('button');
                removeBtn.textContent = '✕';
                removeBtn.style.cssText = 'position:absolute;top:-5px;right:-5px;background:var(--danger);color:white;border:none;border-radius:50%;width:22px;height:22px;cursor:pointer;font-size:0.7rem;';
                removeBtn.onclick = function() { imageFiles.splice(i, 1); updatePreview(); };
                container.appendChild(imgEl);
                container.appendChild(removeBtn);
                preview.appendChild(container);
            });
        }

        function selectBadge(el) {
            document.querySelectorAll('.badge-option').forEach(function(b) { b.classList.remove('active'); });
            el.classList.add('active');
            document.getElementById('productBadge').value = el.dataset.value;
        }

        function switchTab(tab) {
            document.querySelectorAll('.tab').forEach(function(t) { t.classList.remove('active'); });
            document.querySelectorAll('.tab-content').forEach(function(c) { c.classList.remove('active'); });
            event.target.classList.add('active');
            document.getElementById('tab-' + tab).classList.add('active');
        }

        document.getElementById('productForm').addEventListener('submit', function(e) {
            e.preventDefault();
            if (imageFiles.length === 0) {
                showToast('أضف صورة واحدة على الأقل', 'error');
                return;
            }
            var product = {
                id: editingId || Date.now(),
                name: document.getElementById('productName').value.trim(),
                price: parseFloat(document.getElementById('productPrice').value),
                size: document.getElementById('productSize').value.trim(),
                badge: document.getElementById('productBadge').value,
                images: imageFiles.map(function(f) { return f.data; })
            };
            if (editingId) {
                var idx = products.findIndex(function(p) { return p.id === editingId; });
                if (idx !== -1) products[idx] = product;
                editingId = null;
                document.getElementById('submitBtn').textContent = 'إضافة المنتج';
                document.getElementById('cancelBtn').style.display = 'none';
            } else {
                products.push(product);
            }
            saveProducts();
            resetForm();
        });

        function editProduct(id) {
            var p = products.find(function(pr) { return pr.id === id; });
            if (!p) return;
            editingId = id;
            document.getElementById('productName').value = p.name;
            document.getElementById('productPrice').value = p.price;
            document.getElementById('productSize').value = p.size;
            document.getElementById('productBadge').value = p.badge || '';
            document.querySelectorAll('.badge-option').forEach(function(b) {
                b.classList.toggle('active', b.dataset.value === (p.badge || ''));
            });
            imageFiles = p.images.map(function(img) { return { data: img, name: img.split('/').pop(), isUrl: !img.startsWith('data:') }; });
            updatePreview();
            document.getElementById('submitBtn').textContent = 'حفظ التعديلات';
            document.getElementById('cancelBtn').style.display = 'inline-block';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function deleteProduct(id) {
            if (!confirm('هل أنت متأكد من حذف هذا المنتج؟')) return;
            products = products.filter(function(p) { return p.id !== id; });
            saveProducts();
        }

        function resetForm() {
            document.getElementById('productForm').reset();
            document.querySelectorAll('.badge-option').forEach(function(b) { b.classList.remove('active'); });
            imageFiles = [];
            updatePreview();
            editingId = null;
            document.getElementById('submitBtn').textContent = 'إضافة المنتج';
            document.getElementById('cancelBtn').style.display = 'none';
        }

        function saveProducts() {
            var json = JSON.stringify(products, null, 2);
            var content = btoa(unescape(encodeURIComponent(json)));
            showToast('جاري الحفظ...', 'success');

            fetch('https://api.github.com/repos/' + repoOwner + '/' + repoName + '/contents/products.json', {
                headers: { 'Authorization': 'token ' + githubToken, 'Accept': 'application/vnd.github.v3+json' }
            })
            .then(function(r) { return r.json(); })
            .then(function(data) {
                return fetch('https://api.github.com/repos/' + repoOwner + '/' + repoName + '/contents/products.json', {
                    method: 'PUT',
                    headers: { 'Authorization': 'token ' + githubToken, 'Content-Type': 'application/json', 'Accept': 'application/vnd.github.v3+json' },
                    body: JSON.stringify({
                        message: 'Update products via admin panel',
                        content: content,
                        sha: data.sha
                    })
                });
            })
            .then(function(r) { return r.json(); })
            .then(function() {
                showToast('تم الحفظ بنجاح!', 'success');
                renderProducts();
            })
            .catch(function(e) {
                showToast('خطأ في الحفظ: ' + e.message, 'error');
            });
        }

        function showToast(msg, type) {
            var toast = document.createElement('div');
            toast.className = 'toast toast-' + type;
            toast.textContent = msg;
            document.body.appendChild(toast);
            setTimeout(function() { toast.remove(); }, 3000);
        }

        init();
    </script>
</body>
</html>

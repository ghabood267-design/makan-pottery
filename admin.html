<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAKAN - إدارة</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Tajawal',sans-serif;background:#FDFBF7;color:#2C3E2E}
        .header{background:#2C3E2E;color:#FDFBF7;padding:1.5rem 2rem;display:flex;justify-content:space-between;align-items:center}
        .header h1{font-size:1.5rem;font-weight:900;letter-spacing:3px}
        .header a{color:#D4A359;text-decoration:none;font-weight:600}
        .container{max-width:900px;margin:2rem auto;padding:0 1rem}
        .card{background:#fff;border-radius:16px;padding:2rem;margin-bottom:2rem;box-shadow:0 4px 20px rgba(0,0,0,.06);border:1px solid #E8E2D8}
        .card h2{font-size:1.3rem;font-weight:800;color:#C85A32;margin-bottom:1rem;border-bottom:3px solid #D4A359;padding-bottom:.5rem;display:inline-block}
        label{font-weight:600;display:block;margin-bottom:.3rem}
        input[type=text],input[type=number],input[type=url],input[type=password]{width:100%;padding:.7rem;border:2px solid #E8E2D8;border-radius:8px;font-family:'Tajawal';font-size:1rem}
        input:focus{border-color:#C85A32;outline:none}
        .row{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
        .mb{margin-bottom:1rem}
        .btn{padding:.7rem 1.5rem;border:none;border-radius:8px;font-family:'Tajawal';font-size:1rem;font-weight:700;cursor:pointer}
        .btn-p{background:#C85A32;color:#fff}
        .btn-g{background:#D4A359;color:#1A1A1A}
        .btn-d{background:#e74c3c;color:#fff}
        .btn:hover{opacity:.85}
        .badges{display:flex;gap:.5rem;flex-wrap:wrap}
        .badge-opt{padding:.3rem .8rem;border:2px solid #E8E2D8;border-radius:20px;cursor:pointer;font-size:.85rem}
        .badge-opt.on{border-color:#D4A359;background:#D4A359;color:#1A1A1A;font-weight:700}
        .item{display:flex;align-items:center;gap:1rem;padding:1rem;background:#FDFBF7;border-radius:10px;border:1px solid #E8E2D8;margin-bottom:.5rem}
        .item .info{flex:1}
        .item .info h4{font-size:1rem}
        .item .info p{font-size:.85rem;color:#7A8A7C}
        .toast{position:fixed;bottom:2rem;left:50%;transform:translateX(-50%);padding:1rem 2rem;border-radius:10px;color:#fff;font-weight:600;z-index:9999}
        .ok{background:#27ae60}
        .er{background:#e74c3c}
        .lock{display:flex;align-items:center;justify-content:center;min-height:100vh}
        .lock-box{background:#fff;border-radius:20px;padding:3rem;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.1);max-width:400px;width:90%}
        .lock-box .icon{font-size:4rem;margin-bottom:1rem}
        .lock-box input{text-align:center;font-size:1.5rem;letter-spacing:5px;margin:1rem 0;width:100%}
        .lock-box .err{color:#e74c3c;font-weight:600;margin-top:.5rem;display:none}
        .hidden{display:none!important}
    </style>
</head>
<body>
    <div id="lockScreen" class="lock">
        <div class="lock-box">
            <div class="icon">🔒</div>
            <h2>MAKAN - إدارة</h2>
            <p>أدخل كلمة السر</p>
            <input type="password" id="pwd" placeholder="••••" onkeypress="if(event.key==='Enter')login()">
            <button class="btn btn-p" style="width:100%;margin-top:.5rem" onclick="login()">دخول</button>
            <div id="err" class="err">كلمة السر خاطئة!</div>
        </div>
    </div>

    <div id="app" class="hidden">
        <div class="header">
            <h1>MAKAN - إدارة</h1>
            <a href="index.html">الموقع</a>
        </div>
        <div class="container">
            <div class="card" style="background:rgba(212,163,89,.1);border-color:#D4A359">
                <h2 style="border-color:#2C3E2E">GitHub Token</h2>
                <p style="color:#7A8A7C;margin-bottom:.8rem;font-size:.9rem">لتضيف/تحذف منتجات من الموقع. <a href="https://github.com/settings/tokens/new?scopes=repo" target="_blank" style="color:#C85A32">أنشئ من هنا</a></p>
                <div style="display:flex;gap:.5rem">
                    <input type="password" id="token" placeholder="ghp_xxxxxxxx" style="flex:1">
                    <button class="btn btn-g" onclick="saveToken()">حفظ</button>
                </div>
                <p id="tokStatus" style="margin-top:.5rem;font-size:.85rem;font-weight:600"></p>
            </div>

            <div class="card">
                <h2>إضافة منتج</h2>
                <form onsubmit="addProduct(event)">
                    <div class="row mb">
                        <div><label>الاسم *</label><input type="text" id="pName" required placeholder="قوار زرع"></div>
                        <div><label>السعر *</label><input type="number" id="pPrice" required min="0" placeholder="18"></div>
                    </div>
                    <div class="mb"><label>المقاس *</label><input type="text" id="pSize" required placeholder="📏 ارتفاع 64 سم | عرض 40 سم"></div>
                    <div class="mb">
                        <label>الشارة</label>
                        <div class="badges">
                            <span class="badge-opt on" data-v="" onclick="pickBadge(this)">بدون</span>
                            <span class="badge-opt" data-v="جديد" onclick="pickBadge(this)">جديد</span>
                            <span class="badge-opt" data-v="الأكثر مبيعاً" onclick="pickBadge(this)">الأكثر مبيعاً</span>
                            <span class="badge-opt" data-v="عرض خاص" onclick="pickBadge(this)">عرض خاص</span>
                        </div>
                        <input type="hidden" id="pBadge" value="">
                    </div>
                    <div class="mb">
                        <label>صور المنتج *</label>
                        <p style="font-size:.8rem;color:#7A8A7C;margin-bottom:.3rem">أضف رابط صورة واحد على الأقل، أو ارفع صور من جهازك من الأسفل</p>
                        <div id="urlList">
                            <input type="url" class="pUrl mb" placeholder="https://example.com/image.jpg">
                        </div>
                        <button type="button" class="btn btn-g" onclick="addUrl()" style="font-size:.85rem">+ إضافة صورة</button>
                        <div style="margin-top:1rem;padding-top:1rem;border-top:2px dashed #E8E2D8">
                            <label style="font-size:.9rem">📤 أو ارفع صور من جهازك</label>
                            <input type="file" id="pFiles" accept="image/*" multiple style="display:block;margin:.5rem 0;font-family:'Tajawal'">
                            <button type="button" class="btn btn-p" id="upBtn" onclick="uploadImages()" style="font-size:.85rem">رفع الصور</button>
                            <p id="upStatus" style="margin-top:.5rem;font-size:.85rem;font-weight:600"></p>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-p">إضافة للموقع</button>
                </form>
            </div>

            <div class="card">
                <h2>حذف منتج</h2>
                <div id="delList"><p style="color:#7A8A7C">جاري التحميل...</p></div>
            </div>
        </div>
    </div>

    <script>
        var TK=localStorage.getItem('gh_token')||'';
        var OWNER='ghabood267-design';
        var REPO='makan-pottery';
        var SHA='',HTML='';

        function login(){
            if(document.getElementById('pwd').value==='2050'){
                document.getElementById('lockScreen').classList.add('hidden');
                document.getElementById('app').classList.remove('hidden');
                init();
            }else{
                document.getElementById('err').style.display='block';
                document.getElementById('pwd').value='';
            }
        }

        function init(){
            if(TK){document.getElementById('token').value=TK;document.getElementById('tokStatus').textContent='Token محفوظ ✓';document.getElementById('tokStatus').style.color='#27ae60';}
            else{document.getElementById('tokStatus').textContent='أدخل Token أولاً';document.getElementById('tokStatus').style.color='#e74c3c';}
            loadHtml();
        }

        function saveToken(){
            var v=document.getElementById('token').value.trim();
            if(v){TK=v;localStorage.setItem('gh_token',TK);document.getElementById('tokStatus').textContent='تم الحفظ ✓';document.getElementById('tokStatus').style.color='#27ae60';toast('تم الحفظ','ok');}
        }

        function loadHtml(){
            if(!TK){document.getElementById('delList').innerHTML='<p style="color:#e74c3c">أدخل Token أولاً</p>';return;}
            fetch('https://api.github.com/repos/'+OWNER+'/'+REPO+'/contents/index.html',{headers:{'Authorization':'token '+TK,'Accept':'application/vnd.github.v3+json'}})
            .then(function(r){if(!r.ok)throw new Error('Token خاطئ أو لا يوجد صلاحية ('+r.status+')');return r.json();})
            .then(function(d){SHA=d.sha;HTML=decodeURIComponent(escape(atob(d.content)));showProducts();})
            .catch(function(e){document.getElementById('delList').innerHTML='<p style="color:#e74c3c">خطأ: '+e.message+'</p>';});
        }

        function showProducts(){
            var list=document.getElementById('delList');
            var parts=HTML.split('<div class="product-card');
            var html='';
            if(parts.length<=1){list.innerHTML='<p>لا يوجد منتجات</p>';return;}
            for(var i=1;i<parts.length;i++){
                var nameMatch=parts[i].match(/<h3 class="product-name">(.*?)<\/h3>/);
                var name=nameMatch?nameMatch[1]:'منتج '+i;
                var priceMatch=parts[i].match(/<p class="product-price">(\d+)/);
                var price=priceMatch?priceMatch[1]:'';
                html+='<div class="item"><div class="info"><h4>'+name+'</h4><p>'+price+' دينار</p></div><button class="btn btn-d" onclick="delProduct('+i+')">حذف '+name+'</button></div>';
            }
            list.innerHTML=html;
        }

        function addUrl(){
            var inp=document.createElement('input');
            inp.type='url';inp.className='pUrl mb';inp.placeholder='https://example.com/image.jpg';
            document.getElementById('urlList').appendChild(inp);
        }

        function uploadImages(){
            var files=document.getElementById('pFiles').files;
            if(!files.length){toast('اختر صورة أولاً','er');return;}
            if(!TK){toast('أدخل Token أولاً','er');return;}
            var btn=document.getElementById('upBtn');
            var status=document.getElementById('upStatus');
            btn.disabled=true;
            status.textContent='';
            var total=files.length,done=0;
            var base=Date.now();
            Array.prototype.forEach.call(files,function(file,idx){
                var reader=new FileReader();
                reader.onload=function(){
                    var img=new Image();
                    img.onload=function(){
                        var scale=Math.min(1,1200/Math.max(img.width,img.height));
                        var canvas=document.createElement('canvas');
                        canvas.width=Math.round(img.width*scale);
                        canvas.height=Math.round(img.height*scale);
                        canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);
                        var data=canvas.toDataURL('image/jpeg',0.85).split(',')[1];
                        var path='images/products/'+base+'-'+idx+'.jpg';
                        status.textContent='جاري رفع '+(idx+1)+' من '+total+' ...';
                        fetch('https://api.github.com/repos/'+OWNER+'/'+REPO+'/contents/'+path,{
                            method:'PUT',
                            headers:{'Authorization':'token '+TK,'Content-Type':'application/json','Accept':'application/vnd.github.v3+json'},
                            body:JSON.stringify({message:'Upload product image',content:data,branch:'master'})
                        })
                        .then(function(r){if(!r.ok)throw new Error('فشل الرفع ('+r.status+')');return r.json();})
                        .then(function(){
                            done++;
                            var inp=document.createElement('input');
                            inp.type='url';inp.className='pUrl mb';
                            inp.value='https://raw.githubusercontent.com/'+OWNER+'/'+REPO+'/master/'+path;
                            document.getElementById('urlList').appendChild(inp);
                            status.textContent='تم رفع '+done+' من '+total+' ✓';
                            if(done===total){
                                btn.disabled=false;
                                document.getElementById('pFiles').value='';
                                toast('تم رفع جميع الصور ✓','ok');
                            }
                        })
                        .catch(function(e){status.textContent='خطأ: '+e.message;btn.disabled=false;toast('خطأ: '+e.message,'er');});
                    };
                    img.onerror=function(){status.textContent='تعذر قراءة الصورة';btn.disabled=false;};
                    img.src=reader.result;
                };
                reader.onerror=function(){status.textContent='تعذر قراءة الملف';btn.disabled=false;};
                reader.readAsDataURL(file);
            });
        }

        function pickBadge(el){
            document.querySelectorAll('.badge-opt').forEach(function(b){b.classList.remove('on');});
            el.classList.add('on');
            document.getElementById('pBadge').value=el.dataset.v;
        }

        function addProduct(e){
            e.preventDefault();
            if(!TK){toast('أدخل Token أولاً','er');return;}
            if(!HTML){toast('جاري التحميل...','er');return;}

            var name=document.getElementById('pName').value.trim();
            var price=document.getElementById('pPrice').value;
            var size=document.getElementById('pSize').value.trim();
            var badge=document.getElementById('pBadge').value;

            var urls=[];
            document.querySelectorAll('.pUrl').forEach(function(i){if(i.value.trim())urls.push(i.value.trim());});
            if(!urls.length){toast('أضف صورة واحدة على الأقل','er');return;}

            var badgeH=badge?'                    <span class="product-badge">'+badge+'</span>\n':'';
            var slides='';var dots='';
            urls.forEach(function(u,j){
                slides+='                        <div class="product-slide'+(j===0?' active':'')+'"><img src="'+u+'" alt="'+name+'"></div>\n';
                dots+='                            <button class="slider-dot'+(j===0?' active':'')+'" onclick="goToSlide(this,'+j+')"></button>\n';
            });

            var card='\n            <div class="product-card fade-in">\n'+
                '                <div class="product-image">\n'+
                badgeH+
                '                    <div class="product-slider">\n'+
                slides+
                '                        <button class="slider-arrow prev" onclick="changeSlide(this,-1)">❮</button>\n'+
                '                        <button class="slider-arrow next" onclick="changeSlide(this,1)">❯</button>\n'+
                '                        <div class="slider-dots">\n'+
                dots+
                '                        </div>\n'+
                '                    </div>\n'+
                '                </div>\n'+
                '                <div class="product-info">\n'+
                '                    <h3 class="product-name">'+name+'</h3>\n'+
                '                    <p class="product-size">'+size+'</p>\n'+
                '                    <p class="product-price">'+price+' <span>دينار</span></p>\n'+
                '                    <button class="order-btn" onclick="orderProduct(\''+name.replace(/'/g,"\\'")+' - '+price+' دينار\')">اطلب الآن</button>\n'+
                '                </div>\n'+
                '            </div>';

            var newHtml=HTML.replace(
                /\n\s*<\/div>\s*\n\s*<\/section>\s*\n\s*<section class="about-section"/,
                '\n'+card+'\n        </div>\n    </section>\n\n    <section class="about-section"'
            );

            if(newHtml===HTML){toast('خطأ في موقع الإدراج','er');return;}

            toast('جاري الحفظ...','ok');
            var content=btoa(unescape(encodeURIComponent(newHtml)));
            fetch('https://api.github.com/repos/'+OWNER+'/'+REPO+'/contents/index.html',{
                method:'PUT',
                headers:{'Authorization':'token '+TK,'Content-Type':'application/json','Accept':'application/vnd.github.v3+json'},
                body:JSON.stringify({message:'Add: '+name,content:content,sha:SHA})
            })
            .then(function(r){if(!r.ok)throw new Error(r.status);return r.json();})
            .then(function(){
                toast('تمت الإضافة! ستظهر بعد دقائق','ok');
                document.querySelector('form').reset();
                document.querySelectorAll('.badge-opt').forEach(function(b){b.classList.remove('on');});
                document.querySelector('.badge-opt').classList.add('on');
                document.getElementById('urlList').innerHTML='<input type="url" class="pUrl mb" placeholder="https://example.com/image.jpg">';
                loadHtml();
            })
            .catch(function(e){toast('خطأ: '+e.message,'er');});
        }

        function delProduct(idx){
            if(!confirm('هل أنت متأكد من الحذف؟'))return;
            if(!TK){toast('أدخل Token','er');return;}

            var parts=HTML.split('<div class="product-card');
            if(idx<1||idx>=parts.length){toast('المنتج غير موجود','er');return;}

            var before=parts.slice(0,idx).join('<div class="product-card');
            var after=parts.slice(idx+1).join('<div class="product-card');
            var newHtml=before+after;

            toast('جاري الحذف...','ok');
            var content=btoa(unescape(encodeURIComponent(newHtml)));
            fetch('https://api.github.com/repos/'+OWNER+'/'+REPO+'/contents/index.html',{
                method:'PUT',
                headers:{'Authorization':'token '+TK,'Content-Type':'application/json','Accept':'application/vnd.github.v3+json'},
                body:JSON.stringify({message:'Delete product',content:content,sha:SHA})
            })
            .then(function(r){if(!r.ok)throw new Error(r.status);return r.json();})
            .then(function(){toast('تم الحذف!','ok');loadHtml();})
            .catch(function(e){toast('خطأ: '+e.message,'er');});
        }

        function toast(msg,type){
            var t=document.createElement('div');
            t.className='toast '+type;t.textContent=msg;
            document.body.appendChild(t);
            setTimeout(function(){t.remove();},3000);
        }
    </script>
</body>
</html>
